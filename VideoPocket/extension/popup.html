<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoPocket</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="source-row"><span id="sourceLabel" class="source-label" role="status" tabindex="-1">Scanning videos…</span><span id="pageTitle" class="source-title" hidden></span><select id="mediaSelect" aria-label="Current video" aria-hidden="true" tabindex="-1" hidden></select><div id="mediaChooser" hidden aria-label="Current video"></div><button id="themeToggle" type="button" class="icon-button theme-button" title="Switch to dark theme" aria-label="Switch to dark theme" aria-pressed="false"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button id="pickMedia" class="icon-button" title="Select video on page" aria-label="Select video on page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4M12 7v10m-5-5h10"/></svg></button><button id="refresh" class="icon-button" title="Refresh video information" aria-label="Refresh video information"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v5h-5M19.5 10a8 8 0 1 0 .2 5"/></svg></button></div>
  <main>
    <section id="downloadSection" aria-label="Download" hidden>
      <div class="download-toolbar" role="group" aria-label="Download options">
        <div class="switch" role="tablist" aria-label="Media type"><button id="videoTab" role="tab" aria-selected="true" class="active">Video</button><button id="audioTab" role="tab" aria-selected="false">Audio</button><button id="subtitleTab" role="tab" aria-selected="false" disabled title="No captions">Subtitles</button></div>
        <div id="videoSettings" class="settings"><label><span class="setting-title">Format</span><select id="videoFormat" aria-label="Video format" disabled><option value="auto">Source format</option></select><span id="videoFormatValue" class="choice-value" hidden aria-hidden="true"></span></label><label><span class="setting-title">Quality</span><select id="height" aria-label="Video quality" disabled><option value="0">Best</option></select><span id="heightValue" class="choice-value" hidden aria-hidden="true"></span></label></div>
        <div id="audioSettings" class="settings" hidden><label><span class="setting-title">Format</span><select id="audioFormat" aria-label="Audio format" disabled><option value="original">Original audio</option></select><span id="audioFormatValue" class="choice-value" hidden aria-hidden="true"></span></label><label><span class="setting-title">Quality</span><select id="audioQuality" aria-label="Audio quality" disabled><option value="best">Best</option><option value="128">128 kbps</option><option value="192">192 kbps</option><option value="320">320 kbps</option></select><span id="audioQualityValue" class="choice-value" hidden aria-hidden="true"></span></label></div>
        <div id="subtitleSettings" class="settings" hidden><label><span class="setting-title">Format</span><select id="subtitleFormat" aria-label="Subtitle format"><option value="txt">TXT</option><option value="srt">SRT</option><option value="vtt">VTT</option><option value="plain">Plain text</option></select><span id="subtitleFormatValue" class="choice-value" hidden aria-hidden="true"></span></label><label><span class="setting-title">Language</span><select id="language" aria-label="Subtitle language"><option value="">Loading…</option></select></label></div>
      </div>
      <button id="download" class="primary" disabled>Download video</button>
      <div id="subtitleSection" aria-label="Subtitles" hidden>
      <button id="loadSubtitle" class="primary" disabled>Capture</button>
      <div id="subtitleContent" hidden>
      <textarea id="preview" rows="4" placeholder="Captions" readonly aria-label="Full captions"></textarea>
      <div class="subtitle-actions"><button id="copy" class="secondary" disabled>Copy</button><button id="saveSubtitle" class="secondary" disabled>Download</button></div>
      </div>
      </div>
    </section>
      <details id="rangeSettings" class="range-settings" hidden>
        <summary>Clip download</summary>
        <div id="rangeControls">
        <div id="rangeSliders" class="range-timeline" role="group" aria-label="Video clip range">
          <div class="range-rail" aria-hidden="true"><div class="range-fill"></div></div>
            <input id="rangeStartSlider" type="range" min="0" max="0" step="0.1" value="0" aria-label="Clip start slider">
            <input id="rangeEndSlider" type="range" min="0" max="0" step="0.1" value="0" aria-label="Clip end slider">
        </div>
        <div class="range-times">
          <input id="rangeStart" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" aria-label="Clip start time" aria-describedby="rangeMessage">
          <input id="rangeEnd" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" aria-label="Clip end time" aria-describedby="rangeMessage">
        </div>
        <div id="rangeMessage" class="range-message" role="status" aria-live="polite" hidden></div>
        <div id="rangeWarning" class="range-warning" role="status" hidden>This source must be fully downloaded before trimming</div>
        </div>
      </details>
    <ul id="job" class="job-list" aria-label="Download jobs" hidden></ul>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="diagnosticRow" class="diagnostic-row" role="status" aria-live="polite" hidden><span id="diagnosticText"></span><button id="dismissError" class="icon-button" title="Dismiss error" aria-label="Dismiss error">×</button></div>
  </main><script type="module" src="popup.js"></script>
</body></html>
